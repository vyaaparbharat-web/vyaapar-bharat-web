<!doctype html>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#001a5c" />

    <!-- Default SEO. Each page replaces these with its own (see src/lib/seo.js),
         and the server fills them in for supplier/product/category pages so share previews work. -->
    <title>Vyapaar Bharat: B2B marketplace for suppliers, transporters and wholesalers in India</title>
    <meta
      name="description"
      content="Post your requirement free and get quotes from verified suppliers across India. Transporters, hosiery and garment manufacturers, tyre dealers, auto parts, wholesalers and more."
    />
    <link rel="canonical" href="https://vyapaarbharat.net/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:site_name" content="Vyapaar Bharat" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://vyapaarbharat.net/" />
    <meta property="og:title" content="Vyapaar Bharat: B2B marketplace for suppliers, transporters and wholesalers in India" />
    <meta
      property="og:description"
      content="Post your requirement free and get quotes from verified suppliers across India. Transporters, hosiery and garment manufacturers, tyre dealers, auto parts, wholesalers and more."
    />
    <meta property="og:image" content="https://vyapaarbharat.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vyapaar Bharat: B2B marketplace for suppliers, transporters and wholesalers in India" />

      name="twitter:description"
      content="Post your requirement free and get quotes from verified suppliers across India."
    />
    <meta name="twitter:image" content="https://vyapaarbharat.net/og-image.jpg" />

    <!-- Who we are, and the site search box Google can show under the result -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://vyapaarbharat.net/#org",
            "name": "Vyapaar Bharat",
            "alternateName": "व्यापार भारत",
            "url": "https://vyapaarbharat.net/",
            "logo": "https://vyapaarbharat.net/icon-512.png",
            "email": "info@vyapaarbharat.com",
            "telephone": "+91-62849-75308",
            "areaServed": "IN"
          },
          {
            "@type": "WebSite",
            "@id": "https://vyapaarbharat.net/#website",
            "name": "Vyapaar Bharat",
            "url": "https://vyapaarbharat.net/",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://vyapaarbharat.net/#org" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://vyapaarbharat.net/products?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
